name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, race tests vs. Redis + pgvector, benchmark smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: llmgw
          POSTGRES_PASSWORD: llmgw
          POSTGRES_DB: llmgateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llmgw -d llmgateway"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LLMGW_TEST_REDIS_ADDR: localhost:6379
      LLMGW_TEST_POSTGRES_DSN: postgres://llmgw:llmgw@localhost:5432/llmgateway?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal migrations)" || (gofmt -l cmd internal migrations && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: guardrail <1ms latency budget (no race instrumentation)
        run: go test -count=1 -run TestLatencyBudget -v ./internal/guardrails
      - name: guardrail latency benchmarks
        run: go test -run '^$' -bench . -benchtime 2000x ./internal/guardrails ./internal/cache
      - name: benchmark smoke (cmd/bench)
        run: |
          go run ./cmd/bench -requests 1000 -concurrency 50 -baseline 100 -hot-requests 2000 \
            -redis localhost:6379 -postgres "$LLMGW_TEST_POSTGRES_DSN" -out bench-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: go-artifacts
          path: |
            coverage.out
            bench-ci.json

  web:
    name: Web (typecheck, Jest, build, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results

  docker:
    name: Docker images + compose end-to-end
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway
          push: false
          tags: ghcr.io/yj3335/llm-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: mockllm image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mockllm
          push: false
          tags: ghcr.io/yj3335/llm-gateway-mockllm:${{ github.sha }}
          cache-from: type=gha
      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: ghcr.io/yj3335/llm-gateway-web:${{ github.sha }}
      - name: validate docker compose
        run: docker compose config -q
      - name: docker compose up (full stack)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: compose end-to-end smoke test
        run: scripts/compose-smoke.sh
      - name: compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: compose down
        if: always()
        run: docker compose down -v

  kubernetes:
    name: Kubernetes (kind) end-to-end
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: docker compose build gateway mockllm web
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: llmgw
      - name: install ingress-nginx + metrics-server
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/baremetal/deploy.yaml
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          # kind kubelets use self-signed serving certs
          kubectl -n kube-system patch deploy metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n ingress-nginx wait --for=condition=Available deploy/ingress-nginx-controller --timeout=300s
          kubectl -n kube-system wait --for=condition=Available deploy/metrics-server --timeout=300s
      - name: load images into kind
        run: kind load docker-image llm-gateway-gateway:latest llm-gateway-mockllm:latest llm-gateway-web:latest --name llmgw
      - name: deploy (production manifests + local overlay)
        run: kubectl apply -k deploy/k8s/overlays/local
      - name: Kubernetes end-to-end test
        run: scripts/k8s-smoke.sh
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n llm-gateway describe pods | tail -120
          kubectl -n llm-gateway logs deploy/llm-gateway --tail 80 || true
