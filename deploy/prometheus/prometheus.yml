global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
    # In Kubernetes use pod discovery instead (see deploy/k8s/base/gateway.yaml annotations):
    # kubernetes_sd_configs: [{ role: pod }]
