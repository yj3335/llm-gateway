apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway-web
  namespace: llm-gateway
  labels: { app.kubernetes.io/name: llm-gateway-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: llm-gateway-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: llm-gateway-web }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: web
          image: ghcr.io/yj3335/llm-gateway-web:latest
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-web
  namespace: llm-gateway
spec:
  selector: { app.kubernetes.io/name: llm-gateway-web }
  ports: [{ name: http, port: 80, targetPort: http }]
