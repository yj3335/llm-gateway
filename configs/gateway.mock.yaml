# LLM Gateway configuration for the bundled mock upstream (cmd/mockllm).
# Used by docker compose, CI and the Kubernetes local overlay; needs no model
# downloads. For live local inference see configs/gateway.yaml (Ollama).
# Every value can be overridden via LLMGW_* environment variables (see internal/config).
server:
  addr: ":8080"
  read_timeout: 30s
  write_timeout: 120s
  max_body_bytes: 1048576
  cors_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]
  enable_chaos_headers: true        # playground/bench fault injection; disable in production
  dependency_wait: 30s              # retry Redis/Postgres at startup before falling back to memory

auth:
  jwt_hmac_secret: "dev-insecure-change-me"
  issuer: "llm-gateway"
  audience: "llm-gateway"
  dev_token_endpoint: true          # POST /v1/auth/token (disable in production)
  api_key_cache_ttl: 60s
  default_rpm: 600
  default_tpm: 200000
  default_pii_mode: REDACT
  dev_token_ttl: 12h

redis:
  addr: "localhost:6379"
  pool_size: 256
  dial_timeout: 500ms
  op_timeout: 250ms

postgres:
  dsn: "postgres://llmgw@localhost:5432/llmgateway?sslmode=disable"
  max_conns: 64
  min_conns: 32                     # pre-warmed so bursts never pay connection setup
  run_migrations: true
  hnsw_ef_search: 40

ratelimit:
  enabled: true
  default_max_tokens: 256

guardrails:
  enabled: true
  injection_threshold: 0.7
  scan_output: true

cache:
  enabled: true
  similarity_threshold: 0.86
  ttl: 24h
  l1_max_entries: 50000
  embedder: hashing                 # "hashing" (local, deterministic) | "openai" (external API)
  embedding_url: "http://localhost:8090/v1/embeddings"
  embedding_model: "text-embedding-3-small"
  embedding_api_key_env: OPENAI_API_KEY
  write_queue_size: 8192
  write_workers: 8

# All providers point at the bundled mock upstream; swap base_url/api_key_env
# for real endpoints (https://api.openai.com, https://api.anthropic.com,
# https://generativelanguage.googleapis.com, http://ollama:11434).
providers:
  - name: openai
    type: openai
    base_url: "http://localhost:8090"
    api_key_env: OPENAI_API_KEY
    timeout: 30s
    default_model: gpt-4o-mini
  - name: anthropic
    type: anthropic
    base_url: "http://localhost:8090"
    api_key_env: ANTHROPIC_API_KEY
    timeout: 30s
    default_model: claude-3-5-haiku-latest
  - name: gemini
    type: gemini
    base_url: "http://localhost:8090"
    api_key_env: GEMINI_API_KEY
    timeout: 30s
    default_model: gemini-2.0-flash
  - name: ollama
    type: ollama
    base_url: "http://localhost:8090"
    timeout: 60s
    default_model: llama3.1

routes:
  - match: "gpt-*"
    targets:
      - { provider: openai }
      - { provider: anthropic, model: claude-3-5-haiku-latest }
      - { provider: gemini, model: gemini-2.0-flash }
  - match: "claude-*"
    targets:
      - { provider: anthropic }
      - { provider: openai, model: gpt-4o-mini }
  - match: "gemini-*"
    targets:
      - { provider: gemini }
      - { provider: openai, model: gpt-4o-mini }
  - match: "llama*"
    targets:
      - { provider: ollama }
      - { provider: openai, model: gpt-4o-mini }
  - match: "*"
    targets:
      - { provider: openai }
      - { provider: anthropic, model: claude-3-5-haiku-latest }

circuit_breaker:
  # Trip when >= 50% of the last 20 completed calls failed (min 10 calls).
  # Rate-based tripping avoids false opens when fast 5xx responses race
  # ahead of slow successes under high concurrency.
  failure_rate_window: 20
  min_requests: 10
  failure_threshold: 0              # optional consecutive-failure rule (0 = off)
  failure_rate: 0.5
  open_timeout: 5s
  half_open_max_requests: 2
  half_open_successes: 2

telemetry:
  stream_interval: 1s
  sample_window: 10000

pricing:                            # USD per 1K tokens, used for "cost saved"
  default:        { input: 0.0025,  output: 0.01 }
  "gpt-4o-mini":  { input: 0.00015, output: 0.0006 }
  "gpt-4o":       { input: 0.0025,  output: 0.01 }
  "claude-*":     { input: 0.0008,  output: 0.004 }
  "gemini-*":     { input: 0.0001,  output: 0.0004 }

tenants:
  - tenant_id: demo
    tier: enterprise
    rpm_limit: 6000
    tpm_limit: 2000000
    pii_mode: REDACT
    api_keys: ["gw-demo-key-redact"]
  - tenant_id: strict-health
    tier: regulated
    rpm_limit: 600
    tpm_limit: 200000
    pii_mode: BLOCK
    api_keys: ["gw-demo-key-block"]
