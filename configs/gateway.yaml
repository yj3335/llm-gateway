# LLM Gateway configuration: local Ollama models, zero paid API keys.
#   ollama pull qwen3.5:9b && ollama pull gemma4:e4b && ollama pull nomic-embed-text
#   make run            # gateway on :8080 using this file
#   make ollama-check   # live integration test through Ollama
# Every value can be overridden via LLMGW_* environment variables (see internal/config).
# LLMGW_OLLAMA_URL rewrites http://localhost:11434 below (e.g. when the gateway
# runs in a container: http://host.docker.internal:11434).
# The mock-upstream configuration lives in configs/gateway.mock.yaml.
server:
  addr: ":8080"
  read_timeout: 30s
  write_timeout: 300s               # local generation can take a while
  max_body_bytes: 1048576
  cors_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]
  enable_chaos_headers: true        # X-Gateway-Chaos: fail-primary | timeout-primary (disable in production)
  dependency_wait: 30s

auth:
  jwt_hmac_secret: "dev-insecure-change-me"
  issuer: "llm-gateway"
  audience: "llm-gateway"
  dev_token_endpoint: true          # POST /v1/auth/token (disable in production)
  api_key_cache_ttl: 60s
  default_rpm: 600
  default_tpm: 200000
  default_pii_mode: REDACT
  dev_token_ttl: 12h

redis:
  addr: "localhost:6379"
  pool_size: 256
  dial_timeout: 500ms
  op_timeout: 250ms

postgres:
  dsn: "postgres://llmgw@localhost:5432/llmgateway?sslmode=disable"
  max_conns: 64
  min_conns: 32
  run_migrations: true
  hnsw_ef_search: 40

ratelimit:
  enabled: true
  default_max_tokens: 256

guardrails:
  enabled: true
  injection_threshold: 0.7
  scan_output: true

cache:
  enabled: true
  # Deep neural embeddings from Ollama (nomic-embed-text, 768 dimensions).
  # If Ollama is unreachable the gateway falls back to the deterministic
  # hashing embedder; entries from different embedders are never compared.
  embedder: ollama
  embedding_url: "http://localhost:11434/api/embeddings"
  embedding_model: nomic-embed-text
  embedding_dimensions: 0           # 0 = native 768; smaller values truncate (Matryoshka)
  embedding_prefix: ""              # no task prefix: best paraphrase/near-miss separation for this cache
  embedding_timeout: 2s
  # Calibrated on paraphrase vs near-miss pairs: nomic paraphrases scored >= 0.948,
  # different questions <= 0.890 (e.g. "TCP congestion control" vs "TCP flow control").
  similarity_threshold: 0.92
  fallback_similarity_threshold: 0.86   # hashing embedder (fallback) scale
  ttl: 24h
  l1_max_entries: 50000
  write_queue_size: 8192
  write_workers: 8

# Both providers are the same local Ollama server running different models.
# reasoning_effort: none disables "thinking" output: with it enabled, Qwen 3.5 and
# Gemma 4 spend the whole max_tokens budget reasoning and return empty content.
providers:
  - name: ollama-qwen
    type: ollama
    base_url: "http://localhost:11434"
    timeout: 120s
    default_model: "qwen3.5:9b"
    extra_body: { reasoning_effort: none }
  - name: ollama-gemma
    type: ollama
    base_url: "http://localhost:11434"
    timeout: 120s
    default_model: "gemma4:e4b"       # or gemma4:12b for higher quality (needs more memory)
    extra_body: { reasoning_effort: none }

routes:
  # Ask for a Gemma model explicitly: Gemma first, Qwen as fallback.
  - match: "gemma*"
    targets:
      - { provider: ollama-gemma }
      - { provider: ollama-qwen, model: "qwen3.5:9b" }
  # Everything else (including OpenAI-style model names from existing clients):
  # Qwen 3.5 9B primary, Gemma 4 E4B fallback.
  - match: "*"
    targets:
      - { provider: ollama-qwen, model: "qwen3.5:9b" }
      - { provider: ollama-gemma, model: "gemma4:e4b" }

circuit_breaker:
  # Trip when >= 50% of the last 20 completed calls failed (min 10 calls).
  failure_rate_window: 20
  min_requests: 10
  failure_rate: 0.5
  failure_threshold: 0
  open_timeout: 10s
  half_open_max_requests: 2
  half_open_successes: 2

telemetry:
  stream_interval: 1s
  sample_window: 10000

# Local inference costs nothing. These are reference prices (USD per 1K tokens)
# of a comparable hosted model, so "cost saved" estimates the spend a cache hit
# would avoid on a paid API.
pricing:
  default: { input: 0.00015, output: 0.0006 }

tenants:
  - tenant_id: demo
    tier: enterprise
    rpm_limit: 6000
    tpm_limit: 2000000
    pii_mode: REDACT
    api_keys: ["gw-demo-key-redact"]
  - tenant_id: strict-health
    tier: regulated
    rpm_limit: 600
    tpm_limit: 200000
    pii_mode: BLOCK
    api_keys: ["gw-demo-key-block"]
